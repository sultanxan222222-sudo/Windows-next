name: Build Windows Next installer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force

      - name: Run PowerShell tests
        shell: pwsh
        run: |
          Invoke-Pester -Path ./tests -CI -Output Detailed

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }

      - name: Build single EXE installer
        id: build
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $compiler = Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            $compiler = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path -LiteralPath $compiler)) { throw "Inno Setup compiler not found." }

          $iss = Get-Content -LiteralPath '.\installer\WindowsNext.iss' -Raw
          if ($iss -notmatch '(?m)^#define ProductVersion "(\d+\.\d+\.\d+)"\s*$') {
            throw "ProductVersion was not found in installer/WindowsNext.iss."
          }
          $version = $Matches[1]
          $installer = ".\dist\WindowsNext-Setup-$version.exe"

          New-Item -ItemType Directory -Force -Path .\dist | Out-Null
          & $compiler .\installer\WindowsNext.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed." }
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Expected installer EXE was not produced: $installer"
          }
          "product_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Generate SHA-256 checksum
        shell: pwsh
        env:
          PRODUCT_VERSION: ${{ steps.build.outputs.product_version }}
        run: |
          $installer = ".\dist\WindowsNext-Setup-$env:PRODUCT_VERSION.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Installer is missing." }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$installer.sha256" -Value "$hash  $(Split-Path -Leaf $installer)" -Encoding ASCII

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsNext-Setup-${{ steps.build.outputs.product_version }}
          path: |
            dist/WindowsNext-Setup-${{ steps.build.outputs.product_version }}.exe
            dist/WindowsNext-Setup-${{ steps.build.outputs.product_version }}.exe.sha256
          if-no-files-found: error
          retention-days: 30
